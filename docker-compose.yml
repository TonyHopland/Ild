services:
  postgres:
    image: postgres:17-alpine
    container_name: ild-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env (generate one with: openssl rand -hex 32)}"
      # Read by init-databases.sh, which creates one login role per database.
      # They are baked into the roles the first time this volume is initialised;
      # changing one later needs an ALTER ROLE, not just a new value here.
      ILD_DB_PASSWORD: "${ILD_DB_PASSWORD:?Set ILD_DB_PASSWORD in your .env (generate one with: openssl rand -hex 32)}"
      WORKITEM_DB_PASSWORD: "${WORKITEM_DB_PASSWORD:?Set WORKITEM_DB_PASSWORD in your .env (generate one with: openssl rand -hex 32)}"
    # Nothing outside the compose network needs the database — both app services
    # reach it as `postgres:5432`. Uncomment to attach a psql or GUI client from
    # the host for local debugging.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  workitem-server:
    build:
      context: .
      dockerfile: Dockerfile.WorkItemServer
      args:
        DOTNET_VERSION: ${DOTNET_VERSION:-10.0}
    container_name: ild-workitem-server
    # Same reasoning as `ild` below: the entrypoint drops root to the runtime
    # user with gosu at startup and nothing afterwards needs to gain privilege
    # from a setuid bit or a file capability, so refusing that gain is free.
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "8081:8081"
    environment:
      - WORKITEM_DATA_PATH=/data
      - "WORKITEM_DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=IldWorkitems;Username=ild_workitems;Password=${WORKITEM_DB_PASSWORD:?Set WORKITEM_DB_PASSWORD in your .env (generate one with: openssl rand -hex 32)}"
      - "WORKITEM_API_KEYS=${WORKITEM_API_KEYS:?Set WORKITEM_API_KEYS in your .env (generate one with: openssl rand -hex 32)}"
      - WORKITEM_LOG_LEVEL=${WORKITEM_LOG_LEVEL:-${ILD_LOG_LEVEL:-Information}}
      # Attachment sizes, in whole MB. Set on this service as well as on `ild`:
      # this server holds the bytes and is reachable with nothing but an API key,
      # so it enforces the limits itself. See docs/configuration.md.
      - ILD_MAX_ATTACHMENT_MB=${ILD_MAX_ATTACHMENT_MB:-25}
      - ILD_MAX_ATTACHMENTS_TOTAL_MB=${ILD_MAX_ATTACHMENTS_TOTAL_MB:-250}
      - ASPNETCORE_URLS=http://+:8081
    volumes:
      - workitem-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ild:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26-alpine}
        DOTNET_VERSION: ${DOTNET_VERSION:-10.0}
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.13.0}
        NPM_VERSION: ${NPM_VERSION-12.2.1}
        WITH_CERTS: ${WITH_CERTS:-0}
    # ILD joins each run's and chat's network by this name, and they reach it by
    # it (ILD_CONTAINER_ILD_CONTAINER and ILD_API_URL below).
    container_name: ild
    # The image carries setuid-root binaries (util-linux's mount/su), which the
    # flag takes off the table. Nothing here needs the gain it refuses: the
    # entrypoint drops root to `ild` with gosu and nothing afterwards gains a
    # privilege.
    security_opt:
      - "no-new-privileges:true"
    # Worktree previews no longer need a published port each: they are served
    # through 8080 on wildcard subdomains of ILD_PREVIEW_PROXY_BASE below. The
    # old 3100/5100 mappings only ever worked for the two ports this repo's own
    # preview profile happened to suggest, and never for a second concurrent run.
    ports:
      - "8080:8080"
    environment:
      - ILD_USERNAME=${ILD_USERNAME:-admin}
      - ILD_PASSWORD=${ILD_PASSWORD}
      - ILD_DATA_PATH=/data
      - ILD_WORKTREES_PATH=/worktrees
      - "ILD_DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=IldCore;Username=ild_core;Password=${ILD_DB_PASSWORD:?Set ILD_DB_PASSWORD in your .env (generate one with: openssl rand -hex 32)}"
      - ILD_LOG_LEVEL=${ILD_LOG_LEVEL:-Information}
      - ILD_SECRET_KEY=${ILD_SECRET_KEY:-}
      # Keys the session-token hashes, so a UserSessions row cannot be forged by
      # anything that can only write the database. Required rather than optional:
      # unset, the hash is the token's public SHA-256 and the row is forgeable.
      - "ILD_SESSION_TOKEN_PEPPER=${ILD_SESSION_TOKEN_PEPPER:?Set ILD_SESSION_TOKEN_PEPPER in your .env (generate one with: openssl rand -hex 32)}"
      - ILD_ALLOWED_ORIGINS=${ILD_ALLOWED_ORIGINS:-}
      # The reverse proxies whose X-Forwarded-For ILD believes, as addresses or CIDR
      # ranges; see docs/configuration.md.
      - ILD_TRUSTED_PROXIES=${ILD_TRUSTED_PROXIES:-}
      # ILD's address as a run's or chat's container reaches it: its container name.
      - ILD_API_URL=${ILD_API_URL:-http://ild:8080}
      # Serves worktree previews on wildcard subdomains of this origin
      # (wi-<workItemId>[-<serviceName>].ild.localhost:8080). Browsers resolve
      # *.localhost to loopback with no /etc/hosts entry, so this works out of the
      # box for compose. A hostname with no running preview behind it is a flat 404,
      # but a running one IS UNAUTHENTICATED — see docs/deployment.md.
      #
      # `-` rather than `:-` on purpose: the default applies only when the variable
      # is absent, so `ILD_PREVIEW_PROXY_BASE=` in .env turns the feature off. With
      # `:-` an explicit empty value would be overridden by the default and there
      # would be no way to disable it without editing this file.
      - ILD_PREVIEW_PROXY_BASE=${ILD_PREVIEW_PROXY_BASE-http://ild.localhost:8080}
      - ILD_WORKITEM_SERVER_URL=${ILD_WORKITEM_SERVER_URL:-http://workitem-server:8081}
      - "ILD_WORKITEM_SERVER_API_KEY=${ILD_WORKITEM_SERVER_API_KEY:-${WORKITEM_API_KEYS:?Set WORKITEM_API_KEYS in your .env (generate one with: openssl rand -hex 32)}}"
      # Attachment sizes, in whole MB. The same values reach workitem-server
      # above, which enforces them again on its own. See docs/configuration.md.
      - ILD_MAX_ATTACHMENT_MB=${ILD_MAX_ATTACHMENT_MB:-25}
      - ILD_MAX_ATTACHMENTS_TOTAL_MB=${ILD_MAX_ATTACHMENTS_TOTAL_MB:-250}
      # What ILD reads out of a run before it stops, in whole MB. See docs/configuration.md.
      - ILD_MAX_RUN_FILE_MB=${ILD_MAX_RUN_FILE_MB:-64}
      - ILD_MAX_RUN_OUTPUT_MB=${ILD_MAX_RUN_OUTPUT_MB:-16}
      - ILD_MAX_AGENT_OUTPUT_MB=${ILD_MAX_AGENT_OUTPUT_MB:-256}
      - ILD_MAX_BUNDLE_MB=${ILD_MAX_BUNDLE_MB:-2048}
      - ILD_MAX_PREVIEW_DATA_MB=${ILD_MAX_PREVIEW_DATA_MB:-1024}
      # Days a coding-agent release must have been published before ILD installs
      # it automatically, 0 to 365. See docs/configuration.md.
      - ILD_AGENT_UPDATE_COOLDOWN_DAYS=${ILD_AGENT_UPDATE_COOLDOWN_DAYS:-1}
      - ASPNETCORE_URLS=http://+:8080
      # Asks the coding-agent CLIs not to send telemetry. Each CLI decides for
      # itself whether to honour it; setting it is all this can do.
      #
      # `-` rather than `:-`, same reasoning as ILD_PREVIEW_PROXY_BASE above:
      # `DO_NOT_TRACK=` in .env then reaches the agents as an empty value, which
      # most CLIs read as unset. It is the closest thing to opting back in
      # without editing this file, but not a guarantee — a CLI that only checks
      # whether the variable is present at all sees an empty value, and `0`, as
      # "do not track"; that one needs this line removed. See
      # docs/configuration.md.
      - DO_NOT_TRACK=${DO_NOT_TRACK-1}
      # Agent commits default to the host ~/.gitconfig mounted below. Set any
      # of these in your .env to override that identity — git reads them
      # natively and they win over the mounted file. The bare keys pass
      # through only when present in your .env / host environment.
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      # Every loop run, chat and provider sign-in runs in a container of its own
      # on the engine whose socket is mounted below, from the runner image the
      # `runner` service builds (docs/deployment.md#container-run-host).
      - ILD_CONTAINER_SOCKET=/run/container.sock
      - ILD_CONTAINER_RUNNER_IMAGE=${ILD_CONTAINER_RUNNER_IMAGE:-localhost/ild-runner:latest}
      - ILD_CONTAINER_ILD_CONTAINER=ild
      # 1 when the socket belongs to the host's root group (rootful Podman on
      # Linux): the entrypoint then gives it the group ILD_CONTAINER_SOCKET_GID on
      # each start, which makes ILD root-equivalent on that host. A Podman
      # machine's socket is root:wheel and needs nothing.
      - ILD_CONTAINER_SOCKET_GRANT=${ILD_CONTAINER_SOCKET_GRANT:-0}
      - ILD_CONTAINER_SOCKET_GID=${ILD_CONTAINER_SOCKET_GID:-10099}
      # What a run's container may use. 0 for no limit, on a rootless engine
      # whose cgroup controllers are not delegated (a run then fails to start
      # with "crun: open 'memory.max'").
      - ILD_RUN_CPU_LIMIT=${ILD_RUN_CPU_LIMIT:-4}
      - ILD_RUN_MEMORY_LIMIT=${ILD_RUN_MEMORY_LIMIT:-8Gi}
      - ILD_RUN_PIDS_LIMIT=${ILD_RUN_PIDS_LIMIT:-4096}
    volumes:
      # The engine's socket, as the machine the containers run on sees it.
      # Whoever holds it controls every container on that engine; only ILD's
      # process does, never a run or a chat.
      - ${ILD_CONTAINER_SOCKET_HOST:?Set ILD_CONTAINER_SOCKET_HOST in .env to the container engine's socket (see .env.example)}:/run/container.sock
      - ild-data:/data
      - ild-worktrees:/worktrees
      # One volume to persist the provider logins (.claude, .opencode, .pi, ...)
      # across image rebuilds. The entrypoint symlinks each name listed in
      # AGENT_CONFIG_DIRS from ILD's home into it.
      - ild-config:/home/ild/.agent-config
      # Host .gitconfig provides the default commit identity. Point GIT_CONFIG
      # at a different file, or override just the name/email via the
      # GIT_AUTHOR_*/GIT_COMMITTER_* env vars above.
      - ${GIT_CONFIG:-~/.gitconfig}:/home/ild/.gitconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
      workitem-server:
        condition: service_started
      runner:
        condition: service_completed_successfully
    # Compose's default is 10s, which is SHORTER than the 20s run drain
    # (ILD_SHUTDOWN_DRAIN_SECONDS) — SIGKILL would land while runs were still
    # being parked, restoring exactly the hard kill the drain replaces. The
    # required nesting is drain < host shutdown timeout (drain + 5s) < this.
    # Raise it alongside the drain if you lengthen that.
    stop_grace_period: 30s
    restart: unless-stopped

  # Builds the image runs, chats and sign-ins start from, on the engine the stack
  # runs on, where ILD needs it. The container only exits at once; the image is
  # what is used.
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: localhost/ild-runner:latest
    container_name: ild-runner-build
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

volumes:
  postgres-data:
  ild-data:
  ild-worktrees:
  ild-config:
  workitem-data:
