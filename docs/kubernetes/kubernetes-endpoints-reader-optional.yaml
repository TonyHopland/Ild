# Optional: ILD reads the endpoints of the `kubernetes` service in the `default` namespace so the egress proxy also refuses the API
# server at its real addresses, not only at the service's ClusterIP. Without this, ILD logs a warning and protects the ClusterIP alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ild-read-kubernetes-endpoints
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ild-read-kubernetes-endpoints
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ild
    namespace: ild
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ild-read-kubernetes-endpoints
