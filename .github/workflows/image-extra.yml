name: Image (extra targets)

# The image builds that are NOT worth running on every PR.
#
# ci.yml builds the shipped amd64 image on all PRs. These two can only break
# when Docker-related inputs change, and each one costs a full frontend + dotnet
# publish, so they are gated on the paths below instead:
#
#   ild-workitem-server the second Dockerfile.
#   ild-arm64           arm64 on a native arm64 runner. publish.yml builds arm64
#                       for real at release; this surfaces a break on the PR
#                       instead of on the release tag.
#
# The paths list covers more than the Dockerfiles because the images embed the
# project and dependency graph: Dockerfile COPYs each .csproj by name, and the
# frontend stage runs pnpm install against the workspace lockfile. A new project
# or a dependency bump can therefore break these builds on its own.
#
# Runnable on demand from the Actions tab via workflow_dispatch.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.WorkItemServer"
      - "entrypoint.sh"
      - ".dockerignore"
      - "**/*.csproj"
      - "ILD.sln"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "frontend/package.json"
      - ".github/workflows/image-extra.yml"
  workflow_dispatch:

jobs:
  build:
    # Each entry builds on a runner of its own architecture -- no emulation.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ild-workitem-server
            dockerfile: Dockerfile.WorkItemServer
            platform: linux/amd64
            runner: ubuntu-latest
            extra_cache_from: type=gha,scope=ci-ild
            build_args: ""
          - name: ild-arm64
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (${{ matrix.platform }}, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          build-args: ${{ matrix.build_args }}
          # The amd64 entry reads ci.yml's scope as well. The arm64 entry
          # has no such donor and reads only its own scope -- ci.yml builds
          # amd64 only, and publish.yml's arm64 scope is unreachable from here
          # because it is written on tag refs, which a PR run cannot restore.
          cache-from: |
            type=gha,scope=extra-${{ matrix.name }}
            ${{ matrix.extra_cache_from }}
          cache-to: type=gha,mode=max,scope=extra-${{ matrix.name }}
