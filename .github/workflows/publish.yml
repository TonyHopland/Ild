name: Publish

# Build and push the two deployable images to GHCR. Called from ci.yml as a
# final, build-gated job on release tags so a failing build never publishes.
# Tagging/arch rules are recorded in docs/adr/0012-ghcr-image-tagging-strategy.md:
#   tag vX.Y.Z    -> tags X.Y.Z / X.Y / latest, amd64 + arm64
#
# Each {image, arch} pair builds natively on a runner of its own architecture
# and is pushed *by digest only* -- no tags. A per-image `merge` job then binds
# the two digests together under the release tags with `imagetools create`. The
# tags therefore only ever appear once all four builds are green: a failed arch
# leaves untagged blobs in the registry and publishes nothing.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_PREFIX: ghcr.io/tonyhopland

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [ild, ild-workitem-server]
        arch: [amd64, arm64]
        # Per-image and per-arch attributes, folded into all four combinations.
        include:
          - image: ild
            dockerfile: Dockerfile
            # Batteries-included, matching the compose defaults. Coding agents
            # (Pi, OpenCode, Claude Code) are not baked in — they install onto
            # /data on demand from the AI Provider page; WITH_NODE provides npm.
            extra_build_args: |
              WITH_NODE=1
              WITH_DOTNET_SDK=1
              WITH_CHROME=1
              WITH_CERTS=0
          - image: ild-workitem-server
            dockerfile: Dockerfile.WorkItemServer
            extra_build_args: ""
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: vars
        run: |
          version="$(.github/scripts/compute-version.sh \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Labels only: the tags are applied by the merge job, on the manifest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            ${{ matrix.extra_build_args }}
          # Scope the cache per image *and* per arch. Two mode=max writers
          # sharing one scope overwrite each other's manifest, so an
          # image-wide scope would silently leave both arches cacheless.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The digest is all the merge job needs; the filename carries it, so the
      # files themselves are empty. Arch first in the artifact name: `ild` is a
      # prefix of `ild-workitem-server`, so an image-first name could not be
      # globbed back apart per image.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.image }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ild, ild-workitem-server]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*-${{ matrix.image }}
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}
          # `latest` tracks the newest release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest list per image, tagged from the metadata above, with the
      # per-arch children named by the digest each build job left behind (the
      # downloaded files are empty; their names are the payload).
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}

      - name: Inspect manifest list
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
