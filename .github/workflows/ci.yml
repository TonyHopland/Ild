name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish version-stamping tests
        run: .github/scripts/compute-version.test.sh

      - name: Entrypoint config-store linking tests
        run: .github/scripts/entrypoint-link-stores.test.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Frontend check (format + lint + types)
        run: vp check
        working-directory: frontend

      - name: Frontend tests
        run: vp test --run
        working-directory: frontend

      - name: Backend restore
        run: dotnet restore

      - name: Backend build
        run: dotnet build --no-restore --configuration Release

      - name: Backend tests
        run: dotnet test ILD.Tests/ILD.Tests.csproj --no-build --configuration Release --nologo

  # The Dockerfiles are otherwise only exercised at release time by publish.yml,
  # so a broken one fails the tag rather than the PR that broke it. Build here
  # (never push) to close that gap.
  #
  # Only the batteries-included amd64 image, because it is the shipped artifact
  # and it also catches the indirect breakages -- it COPYs each .csproj by name
  # and runs the pnpm install, so a new project or a lockfile change fails here
  # without anyone having touched the Dockerfile. The runtime-only base, the
  # WorkItem Server image, and arm64 can only break when Docker-related files
  # change, so they live in image-extra.yml behind a paths filter rather than
  # rebuilding the frontend and both dotnet publishes on every PR.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ild (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            WITH_NODE=1
            WITH_DOTNET_SDK=1
            WITH_CHROME=1
          # Kept distinct from publish.yml's scopes. image-extra.yml reads this
          # scope too, so its runtime-base build can reuse the frontend and
          # dotnet publish stages instead of repeating them.
          cache-from: type=gha,scope=ci-ild
          cache-to: type=gha,mode=max,scope=ci-ild

  # Publish to GHCR only on a release tag, after the build is green. Merges to
  # main build and test but never publish.
  publish:
    needs: [build-and-test, image-build]
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
