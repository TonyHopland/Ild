name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish version-stamping tests
        run: .github/scripts/compute-version.test.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Frontend check (format + lint + types)
        run: vp check
        working-directory: frontend

      - name: Frontend tests
        run: vp test --run
        working-directory: frontend

      - name: Backend restore
        run: dotnet restore

      - name: Backend build
        run: dotnet build --no-restore --configuration Release

      - name: Backend tests
        run: dotnet test ILD.Tests/ILD.Tests.csproj --no-build --configuration Release --nologo

  # The Dockerfiles are otherwise only exercised at release time by publish.yml,
  # so a broken one fails the tag rather than the PR that broke it. Build here
  # (never push) to close that gap. amd64 only — see image-build-arm64 below.
  image-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ild
            dockerfile: Dockerfile
            build_args: |
              WITH_NODE=1
              WITH_DOTNET_SDK=1
              WITH_CHROME=1
          # Covers the WITH_DOTNET_SDK=0 base (final-base-0). The batteries-
          # included build above always selects final-base-1, so without this
          # the runtime-only base is never built by anything.
          - name: ild-runtime-base
            dockerfile: Dockerfile
            build_args: |
              WITH_NODE=1
              WITH_DOTNET_SDK=0
              WITH_CHROME=0
          - name: ild-workitem-server
            dockerfile: Dockerfile.WorkItemServer
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.build_args }}
          # Scoped per matrix entry so the three builds don't clobber each
          # other's cache, and kept distinct from publish.yml's scopes.
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  # arm64 builds under QEMU emulation and is slow, so it runs on pushes to main
  # rather than on every PR — still ahead of the release that would publish it.
  # Deliberately excluded from `publish`'s needs and skipped on tags, because
  # publish.yml builds arm64 itself; gating on it would emulate the same build
  # twice per release. Only the main image: the arm64-specific logic (Node arch
  # selection, the amd64-only Chrome skip) lives there.
  image-build-arm64:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build ild (arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            WITH_NODE=1
            WITH_DOTNET_SDK=1
            WITH_CHROME=1
          cache-from: type=gha,scope=ci-ild-arm64
          cache-to: type=gha,mode=max,scope=ci-ild-arm64

  # Publish to GHCR only on a release tag, after the build is green. Merges to
  # main build and test but never publish.
  publish:
    needs: [build-and-test, image-build]
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
