packages:
  - frontend

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite: "catalog:"
  ws@7: "^7.5.11"
  ws@8: "^8.21.0"
  nanoid@3: "^3.3.18"
# The vite alias resolves to vite-plus-core 1.x, which fails the vite ^6-^8 peer
# ranges of vitest, @vitest/mocker and @vitejs/plugin-react.
peerDependencyRules:
  allowAny:
    - vite
